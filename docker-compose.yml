version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: career_ai_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=career-ai-super-secret-production-jwt-key
      - DATABASE_URL=sqlite:////app/career_ai.db
    volumes:
      - ./ml/saved_models:/app/ml/saved_models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: career_ai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
